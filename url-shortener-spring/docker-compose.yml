# Optional: only needed if you run with `--spring.profiles.active=postgres`.
# Default (no profile) uses an embedded H2 in-memory database - no Docker required.
version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
    ports:
      - "5432:5432"
    volumes:
      - shortener-pg-data:/var/lib/postgresql/data

volumes:
  shortener-pg-data:
