spring:
  application:
    name: url-shortener-spring
  datasource:
    url: jdbc:h2:mem:shortener;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  cache:
    type: simple

server:
  port: 8080

app:
  public-base-url: http://localhost:8080
  rate-limit:
    capacity: 20
    refill-per-second: 5
  cache:
    max-size: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.schwab.shortener: INFO

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/shortener
    driver-class-name: org.postgresql.Driver
    username: shortener
    password: shortener
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
